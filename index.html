<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Inspire Me | Random Quote Generator</title>

    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>✨ Inspire Me</h1>

        <div class="quote-box">

            <i class="fas fa-quote-left quote-icon"></i>

            <p id="quote" class="quote">
                Click the button to get inspired...
            </p>

            <p id="author" class="author"></p>

        </div>

        <div class="buttons">

            <button class="new" onclick="generateQuote()">
                <i class="fas fa-wand-magic-sparkles"></i>
                New Quote
            </button>

            <button class="copy" onclick="copyQuote()">
                <i class="fas fa-copy"></i>
                Copy
            </button>

            <button class="like" onclick="likeQuote()">
                <i class="fas fa-heart"></i>
                Like
            </button>

        </div>

    </div>

  
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <script src="script.js"></script>

</body>
</html>
